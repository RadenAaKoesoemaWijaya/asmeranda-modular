# Canonical runtime for Asmeranda AI.
#
# This is the single default Docker Compose file used by local development and
# the standard production-like deployment. It starts the active runtime stack:
#   - FastAPI backend on http://localhost:8000
#   - Next.js frontend on http://localhost:3000
#
# Streamlit remains a legacy compatibility path and is intentionally not the
# default runtime in this compose file.
#
# Run:
#   docker compose up --build
#
# Environment variables can still be overridden via a local .env file.

name: asmeranda-ai

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: asmeranda-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ASMERANDA_HOST=0.0.0.0
      - ASMERANDA_PORT=8000
      - ASMERANDA_DATA_DIR=/app/data
      - ASMERANDA_LOG_LEVEL=INFO
      - ASMERANDA_DEBUG=false
      - ASMERANDA_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - asmeranda-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - asmeranda-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://backend:8000
    container_name: asmeranda-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asmeranda-net

volumes:
  asmeranda-data:
    driver: local

networks:
  asmeranda-net:
    driver: bridge
